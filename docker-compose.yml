services:
  db:
    image: postgres:16-alpine
    container_name: nazaha_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nazaha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nazaha_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nazaha_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nazaha} -d ${POSTGRES_DB:-nazaha_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nazaha_pg_data:
    driver: local
